name: castle-grooves

services:
  bot:
    image: ${DOCKER_HUB_USERNAME}/castle-grooves:latest
    environment:
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:?Set DASHBOARD_PUBLIC_URL to the HTTPS dashboard origin.}
      DASHBOARD_DEV_ORIGIN: ${DASHBOARD_DEV_ORIGIN:-}
      DISCORD_OAUTH_CLIENT_ID: ${DISCORD_OAUTH_CLIENT_ID:?Set DISCORD_OAUTH_CLIENT_ID.}
      DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_OAUTH_CLIENT_SECRET:?Set DISCORD_OAUTH_CLIENT_SECRET.}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:?Set DISCORD_OAUTH_REDIRECT_URI.}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:?Set DASHBOARD_SESSION_SECRET.}
      DASHBOARD_ADMIN_DISCORD_USER_IDS: ${DASHBOARD_ADMIN_DISCORD_USER_IDS:-}
      DASHBOARD_DJ_DISCORD_USER_IDS: ${DASHBOARD_DJ_DISCORD_USER_IDS:-}
      DASHBOARD_VIEWER_DISCORD_USER_IDS: ${DASHBOARD_VIEWER_DISCORD_USER_IDS:-}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:?Set GRAFANA_PUBLIC_URL to the LAN-accessible Grafana URL.}
    # The HTTPS reverse proxy is the only public entry point for the bot API.
    expose:
      - '${WEBSERVER_PORT:-1337}'
    labels:
      com.centurylinklabs.watchtower.enable: 'true'

  dashboard:
    image: ${DOCKER_HUB_USERNAME}/castle-grooves-ui:latest
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: http://bot:${WEBSERVER_PORT:-1337}
    depends_on:
      - bot
    ports:
      - '${DASHBOARD_PORT:-5173}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/healthz | grep -q status']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - castle-grooves
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  grafana:
    environment:
      BOT_PUBLIC_URL: ${BOT_PUBLIC_URL:?Set BOT_PUBLIC_URL to the LAN-accessible bot API URL.}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:?Set GRAFANA_PUBLIC_URL to the LAN-accessible Grafana URL.}

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - castle-grooves
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_INCLUDE_RESTARTING: 'true'
      WATCHTOWER_POLL_INTERVAL: '300'
      WATCHTOWER_LABEL_ENABLE: 'true'
      DOCKER_MIN_API_VERSION: '1.24'
      TZ: ${TZ:-America/Toronto}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - castle-grooves
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
