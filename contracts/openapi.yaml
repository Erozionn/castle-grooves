        timezone: { type: string }
        items: { type: array, items: { type: object, required: [id, username, avatarUrl, lastPlayedAt, playCount, aliases], properties: { id: { type: string }, username: { type: [string, 'null'] }, avatarUrl: { type: [string, 'null'] }, lastPlayedAt: { type: string, format: date-time }, playCount: { type: integer }, aliases: { type: array, items: { type: string } } } } }
        nextCursor: { type: [string, 'null'] }
        snapshot: { type: object }
        counts: { type: object }
    EnqueueReceipt:
      type: object
