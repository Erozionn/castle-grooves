        results: { type: array, items: { type: object } }
        error: { type: object }
        playbackStart: { enum: [pending, requested, failed, not_needed] }
    RequesterSummary:
      type: object
      required: [capturedAt, horizonFrom, isTruncated, coverage, requester, totalStarts, topTracks, topArtists, recentPlays]
      properties:
        capturedAt: { type: string, format: date-time }
        horizonFrom: { type: string, format: date-time }
        isTruncated: { type: boolean }
        coverage: { $ref: '#/components/schemas/HistoryCoverage' }
        requester: { type: object, required: [id, username, aliases, avatarUrl], properties: { id: { type: string }, username: { type: [string, 'null'] }, aliases: { type: array, items: { type: string } }, avatarUrl: { type: [string, 'null'] } } }
        totalStarts: { type: integer }
        topTracks: { type: array, items: { $ref: '#/components/schemas/CuratedItem' } }
        topArtists: { type: array, items: { type: object, required: [artist, starts], properties: { artist: { type: string }, starts: { type: integer } } } }
        recentPlays: { type: array, items: { $ref: '#/components/schemas/RecordedPlay' } }
    TrackSummary:
      type: object
      required: [capturedAt, horizonFrom, isTruncated, coverage, track, totalStarts, recentPlays, requesters]
      properties:
        capturedAt: { type: string, format: date-time }
        horizonFrom: { type: string, format: date-time }
        isTruncated: { type: boolean }
        coverage: { $ref: '#/components/schemas/HistoryCoverage' }
        track: { $ref: '#/components/schemas/RecordedPlay/properties/track' }
        totalStarts: { type: integer }
        recentPlays: { type: array, items: { $ref: '#/components/schemas/RecordedPlay' } }
        requesters: { type: array, items: { type: object, required: [id, username, starts], properties: { id: { type: string }, username: { type: [string, 'null'] }, starts: { type: integer } } } }
    ArtistSummary:
      type: object
      required: [capturedAt, horizonFrom, isTruncated, coverage, artist, totalStarts, tracks, recentPlays]
      properties:
        capturedAt: { type: string, format: date-time }
        horizonFrom: { type: string, format: date-time }
        isTruncated: { type: boolean }
        coverage: { $ref: '#/components/schemas/HistoryCoverage' }
        artist: { type: string }
        totalStarts: { type: integer }
        tracks: { type: array, items: { $ref: '#/components/schemas/CuratedItem' } }
        recentPlays: { type: array, items: { $ref: '#/components/schemas/RecordedPlay' } }
    HistoryPlaysPage:
      type: object
      required: [timezone, items, nextCursor, snapshot, counts]
      properties:
        timezone: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/RecordedPlay' } }
        nextCursor: { type: [string, 'null'] }
        snapshot: { type: object, required: [id, capturedAt, expiresAt], properties: { id: { type: string }, capturedAt: { type: string, format: date-time }, expiresAt: { type: string, format: date-time } } }
        counts: { type: object, required: [totalMatchedPlays, exact], properties: { totalMatchedPlays: { type: integer }, exact: { type: boolean } } }
