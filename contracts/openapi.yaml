        playCount: { type: integer }
        lastPlayedAt: { type: string, format: date-time }
        requesterIds: { type: array, items: { type: string } }
        reasons: { type: array, items: { type: string } }
    HistoryCuration:
      type: object
      required: [mode, scope, capturedAt, horizonFrom, isTruncated, coverage, items]
      properties:
        mode: { enum: [people, rediscover, recent] }
        scope: { enum: [people, server] }
        capturedAt: { type: string, format: date-time }
        horizonFrom: { type: string, format: date-time }
        isTruncated: { type: boolean }
